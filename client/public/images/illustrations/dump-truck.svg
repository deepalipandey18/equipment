<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="truckYellowTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE169"/>
      <stop offset="100%" stop-color="#FCC837"/>
    </linearGradient>
    <linearGradient id="truckYellowFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCC837"/>
      <stop offset="100%" stop-color="#E5AA15"/>
    </linearGradient>
    <linearGradient id="truckYellowSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5AA15"/>
      <stop offset="100%" stop-color="#B88005"/>
    </linearGradient>
    <linearGradient id="truckDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#464A50"/>
      <stop offset="100%" stop-color="#222428"/>
    </linearGradient>
    <linearGradient id="truckDeepDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#282A2E"/>
      <stop offset="100%" stop-color="#121315"/>
    </linearGradient>
    <linearGradient id="truckGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80A5B8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#344855" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="truckGroundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181A1D" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#181A1D" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#181A1D" stop-opacity="0"/>
    </radialGradient>
    <filter id="truckSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#181A1D" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="200" cy="255" rx="165" ry="24" fill="url(#truckGroundShadow)"/>

  <g filter="url(#truckSoftGlow)">
    <!-- BACK FAR WHEELS -->
    <ellipse cx="215" cy="210" rx="26" ry="34" fill="url(#truckDeepDark)"/>
    <ellipse cx="280" cy="210" rx="26" ry="34" fill="url(#truckDeepDark)"/>

    <!-- CHASSIS FRAME BEAMS -->
    <path d="M 60 190 L 325 180 L 320 220 L 55 225 Z" fill="url(#truckDark)"/>

    <!-- TIPPER DUMP BED (Tipping Body in Pure Storent Yellow) -->
    <!-- Canopy Shield over Cab -->
    <path d="M 125 90 L 335 75 L 340 180 L 155 185 Z" fill="url(#truckYellowSide)"/>
    <path d="M 125 90 L 335 75 L 320 62 L 115 76 Z" fill="url(#truckYellowTop)"/>
    <path d="M 115 76 L 125 90 L 155 185 L 145 180 Z" fill="url(#truckYellowFront)"/>
    
    <!-- Dump Body Reinforcement Ribs -->
    <rect x="180" y="85" width="8" height="95" rx="2" fill="#FCC837"/>
    <rect x="230" y="81" width="8" height="97" rx="2" fill="#FCC837"/>
    <rect x="280" y="78" width="8" height="98" rx="2" fill="#FCC837"/>

    <!-- Heavy Hydraulic Tipping Ram under Dump Bed -->
    <line x1="165" y1="185" x2="185" y2="140" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <line x1="165" y1="185" x2="175" y2="160" stroke="#222428" stroke-width="12" stroke-linecap="round"/>

    <!-- FRONT CABIN (Heavy Duty Commercial Haulage Cab) -->
    <!-- Cab Body -->
    <path d="M 60 120 L 135 116 L 140 215 L 55 218 Z" fill="url(#truckYellowFront)"/>
    <path d="M 60 120 L 135 116 L 125 105 L 52 108 Z" fill="url(#truckYellowTop)"/>
    <path d="M 52 108 L 60 120 L 55 218 L 47 205 Z" fill="url(#truckYellowSide)"/>

    <!-- Windshield & Side Windows -->
    <path d="M 56 125 L 92 123 L 90 162 L 52 164 Z" fill="url(#truckGlass)"/>
    <path d="M 96 123 L 130 121 L 133 160 L 94 161 Z" fill="url(#truckGlass)"/>
    <!-- Glare reflection -->
    <polygon points="60,126 72,125 65,162 55,163" fill="#FFFFFF" opacity="0.45"/>
    <polygon points="102,124 112,123 108,158 98,159" fill="#FFFFFF" opacity="0.35"/>

    <!-- Massive Front Grille (Dark Charcoal) -->
    <path d="M 48 168 L 88 166 L 85 208 L 46 208 Z" fill="url(#truckDeepDark)"/>
    <!-- Grille Chrome/Yellow Louvers -->
    <line x1="52" y1="175" x2="84" y2="173" stroke="#FCC837" stroke-width="3" stroke-linecap="round"/>
    <line x1="51" y1="183" x2="83" y2="181" stroke="#FCC837" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="191" x2="82" y2="189" stroke="#FCC837" stroke-width="3" stroke-linecap="round"/>
    <line x1="49" y1="199" x2="81" y2="197" stroke="#FCC837" stroke-width="3" stroke-linecap="round"/>

    <!-- Headlights & Fog Lamps -->
    <circle cx="50" cy="214" r="5" fill="#FFE169"/>
    <circle cx="82" cy="212" r="5" fill="#FFE169"/>

    <!-- Heavy Steel Front Bumper -->
    <rect x="42" y="210" width="48" height="15" rx="4" fill="url(#truckDark)"/>

    <!-- Vertical Exhaust Stack behind cab -->
    <rect x="135" y="60" width="7" height="60" rx="3" fill="#222428"/>
    <polygon points="135,60 145,55 142,60" fill="#FCC837"/>

    <!-- NEAR WHEELS (Chunky Mining / Quarry Tread Tires) -->
    <!-- Wheel 1 (Front Steer) -->
    <ellipse cx="90" cy="225" rx="28" ry="36" fill="url(#truckDeepDark)"/>
    <ellipse cx="90" cy="225" rx="16" ry="22" fill="url(#truckDark)"/>
    <circle cx="90" cy="225" r="9" fill="url(#truckYellowFront)"/>
    <circle cx="90" cy="225" r="4" fill="#222428"/>

    <!-- Wheel 2 (Rear Tandem 1) -->
    <ellipse cx="230" cy="225" rx="30" ry="38" fill="url(#truckDeepDark)"/>
    <ellipse cx="230" cy="225" rx="18" ry="24" fill="url(#truckDark)"/>
    <circle cx="230" cy="225" r="10" fill="url(#truckYellowFront)"/>
    <circle cx="230" cy="225" r="4" fill="#222428"/>

    <!-- Wheel 3 (Rear Tandem 2) -->
    <ellipse cx="285" cy="225" rx="30" ry="38" fill="url(#truckDeepDark)"/>
    <ellipse cx="285" cy="225" rx="18" ry="24" fill="url(#truckDark)"/>
    <circle cx="285" cy="225" r="10" fill="url(#truckYellowFront)"/>
    <circle cx="285" cy="225" r="4" fill="#222428"/>

    <!-- STORENT Branding on Dump Body -->
    <rect x="195" y="115" width="70" height="20" rx="4" fill="#222428"/>
    <text x="230" y="129" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#FCC837" text-anchor="middle" letter-spacing="1">STORENT</text>
  </g>
</svg>

