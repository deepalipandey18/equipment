<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="tracYellowTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE169"/>
      <stop offset="100%" stop-color="#FCC837"/>
    </linearGradient>
    <linearGradient id="tracYellowFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCC837"/>
      <stop offset="100%" stop-color="#E5AA15"/>
    </linearGradient>
    <linearGradient id="tracYellowSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5AA15"/>
      <stop offset="100%" stop-color="#B88005"/>
    </linearGradient>
    <linearGradient id="tracDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#464A50"/>
      <stop offset="100%" stop-color="#222428"/>
    </linearGradient>
    <linearGradient id="tracDeepDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#282A2E"/>
      <stop offset="100%" stop-color="#121315"/>
    </linearGradient>
    <radialGradient id="tracGroundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181A1D" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#181A1D" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#181A1D" stop-opacity="0"/>
    </radialGradient>
    <filter id="tracSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#181A1D" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="200" cy="255" rx="160" ry="24" fill="url(#tracGroundShadow)"/>

  <g filter="url(#tracSoftGlow)">
    <!-- BACK FAR WHEELS -->
    <ellipse cx="105" cy="195" rx="22" ry="28" fill="url(#tracDeepDark)"/>
    <ellipse cx="265" cy="180" rx="42" ry="52" fill="url(#tracDeepDark)"/>

    <!-- TRACTOR ENGINE HOOD (Storent Yellow) -->
    <path d="M 85 155 L 185 150 L 190 210 L 80 215 Z" fill="url(#tracYellowFront)"/>
    <path d="M 85 155 L 185 150 L 175 135 L 78 140 Z" fill="url(#tracYellowTop)"/>
    <path d="M 78 140 L 85 155 L 80 215 L 72 200 Z" fill="url(#tracYellowSide)"/>

    <!-- Front Grille & Round Headlights -->
    <path d="M 72 165 L 82 163 L 80 205 L 70 202 Z" fill="url(#tracDeepDark)"/>
    <line x1="74" y1="172" x2="80" y2="171" stroke="#FCC837" stroke-width="2"/>
    <line x1="73" y1="180" x2="79" y2="179" stroke="#FCC837" stroke-width="2"/>
    <line x1="72" y1="188" x2="78" y2="187" stroke="#FCC837" stroke-width="2"/>
    <circle cx="76" cy="155" r="5" fill="#FFE169"/>
    <circle cx="86" cy="154" r="5" fill="#FFE169"/>

    <!-- Chrome/Black Vertical Exhaust Pipe & Rain Flapper -->
    <rect x="155" y="80" width="6" height="60" rx="3" fill="#222428"/>
    <polygon points="152,80 164,75 161,80" fill="#FCC837"/>

    <!-- Air Cleaner Snorkel Pre-Cleaner -->
    <rect x="175" y="105" width="5" height="35" rx="2" fill="#222428"/>
    <ellipse cx="177" cy="103" rx="7" ry="4" fill="#222428"/>

    <!-- REAR MUDGUARD FENDERS (Curved over giant wheels) -->
    <path d="M 215 190 C 215 130, 310 130, 310 190 L 295 190 C 295 145, 230 145, 230 190 Z" fill="url(#tracYellowFront)"/>
    <path d="M 215 190 C 215 130, 310 130, 310 190 L 305 185 C 305 135, 225 135, 220 185 Z" fill="url(#tracYellowTop)"/>

    <!-- OPERATOR SEAT, STEERING WHEEL & CANOPY ROOF -->
    <rect x="235" y="150" width="24" height="28" rx="4" fill="#121315"/>
    <line x1="195" y1="170" x2="210" y2="148" stroke="#222428" stroke-width="5"/>
    <ellipse cx="212" cy="146" rx="9" ry="4" fill="#222428"/>
    <!-- Yellow Canopy Sun-Shade -->
    <line x1="220" y1="180" x2="220" y2="85" stroke="#222428" stroke-width="5"/>
    <line x1="285" y1="170" x2="285" y2="85" stroke="#222428" stroke-width="5"/>
    <path d="M 205 85 L 295 80 L 285 70 L 195 75 Z" fill="url(#tracYellowTop)"/>
    <path d="M 205 85 L 295 80 L 292 88 L 202 93 Z" fill="url(#tracYellowFront)"/>

    <!-- FRONT NEAR WHEEL (Small Steer Tire with Deep Treads) -->
    <ellipse cx="105" cy="225" rx="25" ry="32" fill="url(#tracDeepDark)"/>
    <ellipse cx="105" cy="225" rx="14" ry="18" fill="url(#tracDark)"/>
    <circle cx="105" cy="225" r="8" fill="url(#tracYellowFront)"/>
    <circle cx="105" cy="225" r="3" fill="#222428"/>

    <!-- REAR NEAR WHEEL (Giant Massive Off-Road Agriculture Lug Tire) -->
    <ellipse cx="265" cy="205" rx="48" ry="60" fill="url(#tracDeepDark)"/>
    <ellipse cx="265" cy="205" rx="30" ry="40" fill="url(#tracDark)"/>
    <!-- Heavy Hub & Rim Bolts -->
    <circle cx="265" cy="205" r="18" fill="url(#tracYellowFront)"/>
    <circle cx="265" cy="205" r="6" fill="#222428"/>
    <circle cx="258" cy="199" r="2" fill="#FFFFFF"/>
    <circle cx="272" cy="199" r="2" fill="#FFFFFF"/>
    <circle cx="258" cy="211" r="2" fill="#FFFFFF"/>
    <circle cx="272" cy="211" r="2" fill="#FFFFFF"/>

    <!-- Deep Chevron Agricultural Treads -->
    <rect x="220" y="185" width="8" height="16" rx="2" fill="#121315"/>
    <rect x="225" y="215" width="8" height="16" rx="2" fill="#121315"/>
    <rect x="300" y="175" width="8" height="16" rx="2" fill="#121315"/>
    <rect x="303" y="205" width="8" height="16" rx="2" fill="#121315"/>

    <!-- STORENT Branding on Hood -->
    <rect x="110" y="165" width="45" height="14" rx="3" fill="#222428"/>
    <text x="132" y="175" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="8" fill="#FCC837" text-anchor="middle" letter-spacing="1">STORENT</text>
  </g>
</svg>

