<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="rollYellowTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE169"/>
      <stop offset="100%" stop-color="#FCC837"/>
    </linearGradient>
    <linearGradient id="rollYellowFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCC837"/>
      <stop offset="100%" stop-color="#E5AA15"/>
    </linearGradient>
    <linearGradient id="rollYellowSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5AA15"/>
      <stop offset="100%" stop-color="#B88005"/>
    </linearGradient>
    <linearGradient id="rollDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#464A50"/>
      <stop offset="100%" stop-color="#222428"/>
    </linearGradient>
    <linearGradient id="rollDeepDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#282A2E"/>
      <stop offset="100%" stop-color="#121315"/>
    </linearGradient>
    <linearGradient id="rollSteelDrum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E9399"/>
      <stop offset="50%" stop-color="#4A4E54"/>
      <stop offset="100%" stop-color="#222428"/>
    </linearGradient>
    <radialGradient id="rollGroundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181A1D" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#181A1D" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#181A1D" stop-opacity="0"/>
    </radialGradient>
    <filter id="rollSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#181A1D" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="200" cy="255" rx="160" ry="24" fill="url(#rollGroundShadow)"/>

  <g filter="url(#rollSoftGlow)">
    <!-- BACK FAR WHEEL -->
    <ellipse cx="275" cy="215" rx="30" ry="40" fill="url(#rollDeepDark)"/>

    <!-- ARTICULATED CENTER CHASSIS (Heavy Joint Pivot) -->
    <rect x="180" y="190" width="30" height="35" rx="6" fill="url(#rollDark)"/>
    <circle cx="195" cy="207" r="8" fill="#FCC837"/>

    <!-- REAR ENGINE COMPARTMENT (Storent Yellow) -->
    <path d="M 205 160 L 305 155 L 315 215 L 205 220 Z" fill="url(#rollYellowFront)"/>
    <path d="M 205 160 L 305 155 L 295 142 L 198 145 Z" fill="url(#rollYellowTop)"/>
    <path d="M 295 142 L 305 155 L 315 215 L 305 200 Z" fill="url(#rollYellowSide)"/>
    <!-- Engine Cooling Vents -->
    <rect x="235" y="170" width="5" height="30" rx="2" fill="#222428"/>
    <rect x="245" y="169" width="5" height="30" rx="2" fill="#222428"/>
    <rect x="255" y="168" width="5" height="30" rx="2" fill="#222428"/>

    <!-- OPERATOR CABIN / CANOPY ROOF -->
    <line x1="175" y1="195" x2="175" y2="90" stroke="#222428" stroke-width="6"/>
    <line x1="240" y1="175" x2="235" y2="90" stroke="#222428" stroke-width="6"/>
    <!-- Yellow Canopy Roof -->
    <path d="M 165 90 L 250 85 L 238 75 L 155 78 Z" fill="url(#rollYellowTop)"/>
    <path d="M 165 90 L 250 85 L 248 93 L 163 97 Z" fill="url(#rollYellowFront)"/>
    <!-- Seat & Steering -->
    <rect x="200" y="150" width="22" height="26" rx="4" fill="#121315"/>
    <line x1="180" y1="170" x2="190" y2="152" stroke="#222428" stroke-width="4"/>
    <ellipse cx="190" cy="150" rx="7" ry="3" fill="#222428"/>

    <!-- FRONT DRUM YOKE FRAME (Supporting the Steel Roller) -->
    <path d="M 85 190 L 185 190 L 180 215 L 80 215 Z" fill="url(#rollYellowFront)"/>
    <path d="M 85 190 L 185 190 L 180 180 L 80 180 Z" fill="url(#rollYellowTop)"/>
    <!-- Drum Scraper Blade -->
    <rect x="65" y="215" width="90" height="6" rx="2" fill="#222428"/>

    <!-- MASSIVE SMOOTH STEEL VIBRATORY ROLLER DRUM (Isometric Cylinder) -->
    <!-- Far Side of Drum -->
    <ellipse cx="90" cy="225" rx="38" ry="48" fill="url(#rollSteelDrum)"/>
    <!-- Drum Cylinder Face Highlight (Metallic Reflection) -->
    <path d="M 90 177 C 130 177, 130 273, 90 273 L 135 273 C 175 273, 175 177, 135 177 Z" fill="url(#rollSteelDrum)"/>
    <!-- Drum Near Rim & Center Hub -->
    <ellipse cx="115" cy="225" rx="38" ry="48" fill="url(#rollSteelDrum)"/>
    <ellipse cx="115" cy="225" rx="20" ry="26" fill="url(#rollDark)"/>
    <circle cx="115" cy="225" r="10" fill="url(#rollYellowFront)"/>
    <circle cx="115" cy="225" r="4" fill="#222428"/>

    <!-- REAR NEAR RUBBER DRIVE TIRE (Chunky High Traction) -->
    <ellipse cx="270" cy="220" rx="36" ry="46" fill="url(#rollDeepDark)"/>
    <ellipse cx="270" cy="220" rx="22" ry="28" fill="url(#rollDark)"/>
    <circle cx="270" cy="220" r="12" fill="url(#rollYellowFront)"/>
    <circle cx="270" cy="220" r="4" fill="#222428"/>

    <!-- STORENT Branding on Rear Engine -->
    <rect x="220" y="180" width="50" height="15" rx="3" fill="#222428"/>
    <text x="245" y="191" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="8" fill="#FCC837" text-anchor="middle" letter-spacing="1">STORENT</text>
  </g>
</svg>

